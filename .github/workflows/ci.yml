name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test ARTR.LockSight.slnx -c Release
      - name: Restore in locked mode
        run: dotnet restore ARTR.LockSight.slnx --locked-mode

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Lockfile drift
        uses: ./
        with:
          path: ARTR.LockSight.slnx
          strict: "false"
