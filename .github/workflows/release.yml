name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: dotnet pack src/ARTR.LockSight/ARTR.LockSight.csproj -c Release -o ./artifacts
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          nupkgs=(./artifacts/ARTR.LockSight.*.nupkg)
          if [[ ${#nupkgs[@]} -eq 0 ]]; then
            echo "::error::dotnet pack did not produce an ARTR.LockSight nupkg."
            exit 1
          fi
          # GitHub Release only — do not push to NuGet.org.
          gh release create "${GITHUB_REF_NAME}" "${nupkgs[@]}" \
            --title "ARTR.LockSight ${GITHUB_REF_NAME}" \
            --generate-notes
