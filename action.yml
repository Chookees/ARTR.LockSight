name: "ARTR.LockSight"
description: "Fail the job when NuGet packages.lock.json drifts (NU1004 / RestoreLockedMode doctor)."
branding:
  icon: search
  color: blue
inputs:
  path:
    description: "Solution, project, or directory to scan"
    required: false
    default: "."
  command:
    description: "drift (default), verify, or explain"
    required: false
    default: "drift"
  strict:
    description: "When true, warnings also fail the static scan"
    required: false
    default: "false"
  evaluate:
    description: "When true, drift runs dotnet restore --locked-mode and NuGet decides pass or fail"
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: ARTR.LockSight
      shell: bash
      env:
        LOCKSIGHT_PATH: ${{ inputs.path }}
        LOCKSIGHT_COMMAND: ${{ inputs.command }}
        LOCKSIGHT_STRICT: ${{ inputs.strict }}
        LOCKSIGHT_EVALUATE: ${{ inputs.evaluate }}
        LOCKSIGHT_ACTION_PATH: ${{ github.action_path }}
      run: bash "$LOCKSIGHT_ACTION_PATH/eng/run-locksight-action.sh"
